apis:
  - aid: northbeam:orders-api
    name: Northbeam Orders API
    description: >-
      REST API for submitting order and purchase data to Northbeam as the revenue ground truth
      for multi-touch attribution and media mix modeling. Writes are natural-key upserts on a
      caller-supplied order_id, batched up to 1,000 orders per request, with a partial-update
      PATCH and an additive alias endpoint on v2.
    humanURL: https://docs.northbeam.io/docs/orders-api
    baseURL: https://api.northbeam.io/v2/orders
    tags:
      - Order
      - Attribution
      - E-Commerce
    tags_raw:
      - Orders
      - Attribution
      - E-Commerce
    properties:
      - type: Documentation
        url: https://docs.northbeam.io/docs/orders-api
      - type: APIReference
        url: https://docs.northbeam.io/reference/post_orders-1
      - type: OpenAPI
        url: openapi/northbeam-orders-v2-openapi.yml
      - type: OpenAPI
        url: openapi/northbeam-orders-v1-openapi.yml
      - type: Overlay
        url: overlays/northbeam-orders-v2-overlay.yaml
      - type: Overlay
        url: overlays/northbeam-orders-v1-overlay.yaml
      - type: AgentSkill
        url: skills/northbeam-sync-orders.md
  - aid: northbeam:spend-api
    name: Northbeam Spend API
    description: >-
      REST API for uploading daily and hourly spend records from ad platforms Northbeam does
      not integrate with natively, so those channels can be attributed. Rows are upserted on
      the platform/campaign/adset/ad natural key, which must match the customer's UTM tagging.
    humanURL: https://docs.northbeam.io/docs/spend-api
    baseURL: https://api.northbeam.io/v1
    tags:
      - Spend
      - Ad Platforms
      - Attribution
    properties:
      - type: Documentation
        url: https://docs.northbeam.io/docs/spend-api
      - type: APIReference
        url: https://docs.northbeam.io/reference/post_spend-hourly
      - type: OpenAPI
        url: openapi/northbeam-spend-v1-openapi.yml
      - type: Overlay
        url: overlays/northbeam-spend-v1-overlay.yaml
      - type: AgentSkill
        url: skills/northbeam-sync-ad-spend.md
  - aid: northbeam:data-export-api
    name: Northbeam Data Export API
    description: >-
      Asynchronous REST API for exporting attribution performance metrics including revenue,
      transactions, CAC, AOV and creative analytics across attribution windows and models.
      Submit an export config, poll for the result, or deliver straight to a GCS or S3 bucket.
    humanURL: https://docs.northbeam.io/docs/northbeam-api-data-export-1
    baseURL: https://api.northbeam.io/v1/exports
    tags:
      - Data Export
      - Attribution
      - Performance Metrics
      - ROAS
    properties:
      - type: Documentation
        url: https://docs.northbeam.io/docs/northbeam-api-data-export-1
      - type: APIReference
        url: https://docs.northbeam.io/reference/post_data-export-1
      - type: OpenAPI
        url: openapi/northbeam-data-export-v1-openapi.yml
      - type: Overlay
        url: overlays/northbeam-data-export-v1-overlay.yaml
      - type: RateLimits
        url: https://docs.northbeam.io/docs/northbeam-api-data-export-rate-limits-1
      - type: AgentSkill
        url: skills/northbeam-export-attribution-data.md
  - aid: northbeam:mcp
    name: Northbeam MCP Server
    description: >-
      First-party remote Model Context Protocol server giving an agent read-only access to the
      caller's Northbeam dashboards — performance, attribution, spend and orders. Documented as
      a custom connector for Claude (web, Desktop, Code) and ChatGPT. Secured with OAuth 2.1
      (PKCE, dynamic client registration, scope access:mcp) against an Auth0 tenant; the
      tools/list method is bearer-gated. Available to Pro and Enterprise customers.
    humanURL: https://docs.northbeam.io/docs/connect-northbeam-to-claude
    baseURL: https://mcp.northbeam.io
    tags:
      - MCP
      - Agents
      - Attribution
    properties:
      - type: MCPServer
        url: mcp/northbeam-mcp.yml
      - type: ToolCrosswalk
        url: mcp/northbeam-tool-crosswalk.yml
      - type: Documentation
        url: https://docs.northbeam.io/docs/connect-northbeam-to-claude
      - type: OAuthScopes
        url: well-known/northbeam-oauth-authorization-server.json
