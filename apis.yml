apis:
- aid: northbeam:mcp
  name: Northbeam MCP Server
  description: >-
    First-party remote Model Context Protocol server giving an agent read-only access to the caller's
    Northbeam dashboards — performance, attribution, spend and orders. Documented as a custom connector
    for Claude (web, Desktop, Code) and ChatGPT. Secured with OAuth 2.1 (PKCE, dynamic client registration,
    scope access:mcp) against an Auth0 tenant; the tools/list method is bearer-gated. Available to Pro
    and Enterprise customers.
  humanURL: https://docs.northbeam.io/docs/connect-northbeam-to-claude
  baseURL: https://mcp.northbeam.io
