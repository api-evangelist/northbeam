aid: northbeam
name: Northbeam
description: >-
  Northbeam is a multi-touch marketing attribution platform for e-commerce brands. It joins
  first-party click and view data collected by its own browser pixel to order-level revenue
  and to ad spend across every channel, then reports channel, campaign, adset and ad level
  ROAS, CAC, AOV and creative performance under a choice of attribution models and windows.
  The developer surface is three REST APIs published as OpenAPI: an Orders API for pushing
  purchase data in as the revenue ground truth, a Spend API for uploading cost from channels
  Northbeam does not integrate with natively, and an asynchronous Data Export API for pulling
  attribution metrics back out to Northbeam documents, GCS or S3. Northbeam also runs a
  first-party remote MCP server at mcp.northbeam.io, OAuth-secured and read-only, which it
  documents as a custom connector for Claude and ChatGPT.
type: Index
