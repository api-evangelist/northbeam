    note: >
      The tracking pixel is the only first-party code Northbeam distributes. It is served
      per-tenant from a CDN path templated on the Data Client ID and is UNPINNED — there is
      no version in the URL and no registry metadata endpoint to query, so neither Northbeam
      nor the integrator can state which build a given site is running. Documented at
      https://docs.northbeam.io/docs/non-shopify-installation.md, with an explicit
      instruction not to modify the script. Captured as a component, not a package —
      see components/northbeam-components.yml.
integration_reality: >
  With no SDK in any language, every REST integration is hand-rolled against the four
  OpenAPI documents. The ReadMe reference console generates copy-paste snippets for Shell,
  Ruby, PHP, Python and others, which is the closest thing to a client library Northbeam
  offers. The agent surface is the exception: the MCP server needs no SDK at all, which is
  a plausible reason Northbeam invested there instead.
