openapi: 3.2.0
info:
  title: DATA EXPORT - V1 Breakdowns API
  version: '1'
  description: API for exporting data from Northbeam
  termsOfService: https://www.northbeam.io/terms
servers:
- url: https://api.northbeam.io/v1/exports
security:
- api_key: []
  client_id: []
tags:
- name: Breakdowns
paths:
  /breakdowns:
    get:
      summary: Fetch all labels available for breakdown
      responses:
        '200':
          description: Breakdown labels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Breakdowns'
        '401':
          description: Unauthorized
        '429':
          description: Too many requests
        '500':
          description: Internal server error
      tags:
      - Breakdowns
components:
  schemas:
    Breakdowns:
      type: object
      properties:
        breakdowns:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              values:
                type: array
                items:
                  type: string
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      in: header
    client_id:
      type: apiKey
      name: Data-Client-ID
      in: header
