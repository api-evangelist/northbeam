openapi: 3.2.0
info:
  title: DATA EXPORT - V1 Attribution Models API
  version: '1'
  description: API for exporting data from Northbeam
  termsOfService: https://www.northbeam.io/terms
servers:
- url: https://api.northbeam.io/v1/exports
security:
- api_key: []
  client_id: []
tags:
- name: Attribution Models
paths:
  /attribution-models:
    get:
      summary: Fetch all available attribution models
      responses:
        '200':
          description: Attribution models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionModels'
        '401':
          description: Unauthorized
        '429':
          description: Too many requests
        '500':
          description: Internal server error
      tags:
      - Attribution Models
components:
  schemas:
    AttributionModels:
      type: object
      properties:
        attribution_models:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type:
                - string
                - 'null'
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      in: header
    client_id:
      type: apiKey
      name: Data-Client-ID
      in: header
