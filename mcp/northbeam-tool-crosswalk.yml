source: mcp/northbeam-mcp.yml + openapi/_original/*.json
description: >
  Crosswalk between Northbeam's agent surface (the remote MCP server at
  https://mcp.northbeam.io) and its machine-readable REST core (four OpenAPI documents
  published through the ReadMe API registry). The two surfaces CANNOT be bound row-for-row
  in this round: the MCP tools/list method is bearer-gated (HTTP 401, scope access:mcp) and
  Northbeam publishes no tool reference page, so no tool NAME is known. Nothing is invented
  here — crosswalk[] is deliberately empty and every REST operation is recorded as
  rest_only, which is the honest state of knowledge, not an assertion that no tool covers it.
