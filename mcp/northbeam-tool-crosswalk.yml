divergence_notes:
  - >
    The MCP server is described in Northbeam's docs as READ-ONLY over dashboards. The REST
    surface is predominantly WRITE (order and spend ingestion). These are therefore not two
    projections of the same capability set — a substantial part of the REST surface almost
    certainly has no tool, and the "list my dashboards" capability the docs demonstrate has
    no corresponding public REST operation. Both halves of that divergence remain unproven
    until an authenticated tools/list is possible.
  - >
    The prompts Northbeam publishes ("Meta ROAS last week vs prior week", "top 10 orders by
    revenue", "spend and revenue by platform for the last 30 days") map semantically onto the
    Data Export API (POST /data-export with metrics/breakdowns/attribution-models) and
    GET /orders, but no tool name was observed, so no row is asserted at any confidence.
